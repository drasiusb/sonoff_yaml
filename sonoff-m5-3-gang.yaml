# Board: Espressif ESP32 Dev Module
# Definition: definitions/boards/esp32dev/manifest.yaml

esphome:
  name: sonoff-m5-3-gang
  friendly_name: Sonoff M5 3-Gang

esp32:
  variant: esp32
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: "ZxcLcZTWvTXpn10T+51xJEt3p0hf0aVhCkAqTjiMVO0="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Sonoff M5 3G Fallback
    password: "btvxXc7TuD7i"

captive_portal:

# ---------- Sonoff M5 3-gang hardware ----------
# Pinout: devices.esphome.io/devices/Sonoff-M5
# Relay LEDs are wired to the relays (lit 100% when ON).
# GPIO18 PWM = background brightness of the LEDs when OFF.

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 90s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 300s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"

switch:
  - platform: gpio
    name: "Left"
    id: relay_1
    pin: GPIO23
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Middle"
    id: relay_2
    pin: GPIO19
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Right"
    id: relay_3
    pin: GPIO22
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: status
    name: "Status"
  - platform: gpio
    name: "Left Button"
    id: button_1
    pin:
      number: GPIO04
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.toggle: relay_1
  - platform: gpio
    name: "Middle Button"
    id: button_2
    pin:
      number: GPIO00
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.toggle: relay_2
  - platform: gpio
    name: "Right Button"
    id: button_3
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.toggle: relay_3

output:
  - platform: ledc
    id: pwm_output
    pin: GPIO18
    frequency: 1000 Hz

light:
  - platform: status_led
    id: led_status
    pin:
      number: GPIO05
      inverted: true
  - platform: monochromatic
    output: pwm_output
    name: "Background Brightness"
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:led-outline"
    entity_category: config
