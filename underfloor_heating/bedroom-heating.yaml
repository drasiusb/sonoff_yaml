# Hardware Sonoff MINI R4 Extreme
#
# DS18B20       <---->    SONOFF
# Red     3v3             
# Black   GND
# Yellow  Data            GPIO01 (TX PIN)
# Last known sensor address: 0x7c03209779b5b628
#
# Pin       Function
# GPIO00    BUTTON
# GPIO01    TX
# GPIO03    RX
# GPIO19    Blue LED
# GPIO26    Relay output
# GPIO27    S2 (external switch input)
# GND       S1 (external switch input)

substitutions:
  device_name: "bedroom-heating"

esphome:
  name: ${device_name}
  friendly_name: "Bedroom Underfloor Heating"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  password: ""

ota:
  password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: ${device_name}-fix-me
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

sensor:
  - platform: wifi_signal
    name: ${device_name} Wifi Signal Strength
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: ${device_name} Uptime
    update_interval: 300s
    entity_category: "diagnostic"

text_sensor:
  - platform: wifi_info
    ssid:
      name: Connected SSID
    ip_address:
      name: IP Address
    dns_address:
      name: DNS Address
