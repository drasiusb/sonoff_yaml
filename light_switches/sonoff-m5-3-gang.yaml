# Hardware Sonoff M5 SwitchMan 3-Gang (M5-3C-86, NOT the Matter "W" version)
#
# USB-TTL       <---->    SONOFF (flash header)
# 3v3                     3V3
# GND                     GND
# TX                      RX
# RX                      TX
# Hold MIDDLE button (GPIO00) while powering up = flash mode
#
# Pin       Function
# GPIO04    Button Left
# GPIO00    Button Middle (also BOOT)
# GPIO15    Button Right
# GPIO23    Relay Left   + red LED Left
# GPIO19    Relay Middle + red LED Middle
# GPIO22    Relay Right  + red LED Right
# GPIO05    Blue status LED (in left button)
# GPIO18    PWM, background brightness of red LEDs when relay OFF
#
# TODO
# - Rename relays to real lights (Left/Middle/Right)
# - Decouple mode for smart bulbs (button -> HA event only)
# - Double click / long press as HA events
# - Document this journey
substitutions:
  device_name: "sonoff-m5-3-gang"

esphome:
  name: ${device_name}
  friendly_name: "Sonoff M5 3-Gang"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: ${device_name}-fix-me
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

#######################
### Main Code Below ###
#######################

sensor:
  - platform: wifi_signal
    name: ${device_name} Wifi Signal Strength
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: ${device_name} Uptime
    update_interval: 300s
    entity_category: "diagnostic"

text_sensor:
  - platform: wifi_info
    ssid:
      name: Connected SSID
    ip_address:
      name: IP Address
    dns_address:
      name: DNS Address

button:
  - platform: restart
    name: "Restart"

status_led:
  pin:
    number: GPIO05
    inverted: true

switch:
  - platform: gpio
    pin: GPIO23
    name: "Left"
    id: relay_left
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO19
    name: "Middle"
    id: relay_middle
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO22
    name: "Right"
    id: relay_right
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: status
    name: "Status"

  - platform: gpio
    name: "Button Left"
    id: button_left
    pin:
      number: GPIO04
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.toggle: relay_left

  - platform: gpio
    name: "Button Middle"
    id: button_middle
    pin:
      number: GPIO00
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.toggle: relay_middle

  - platform: gpio
    name: "Button Right"
    id: button_right
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.toggle: relay_right

output:
  - platform: ledc
    id: led_background_pwm
    pin: GPIO18
    frequency: 1000 Hz

light:
  - platform: monochromatic
    output: led_background_pwm
    name: "Background Brightness"
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:led-outline"
    entity_category: "config"
