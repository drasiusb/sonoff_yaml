substitutions:
  device_name: "office-heating"

esphome:
  name: ${device_name}
  friendly_name: "Office Underfloor Heating"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: ${device_name}-fix-me
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

#######################
### Main Code Below ###
#######################

# SAFETY (fail-safe): heating is only allowed while a valid floor temperature
# reading (15..30 C) arrived within the last 60 s. A missing/broken sensor
# (NaN), an out-of-range value or a stale reading forces the relay OFF and the
# controller to OFF. The raw relay is internal, so only the controller can
# drive it.

globals:
  - id: last_temp_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

one_wire:
  - platform: gpio
    pin: GPIO01

sensor:
  - platform: wifi_signal
    name: ${device_name} Wifi Signal Strength
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: ${device_name} Uptime
    update_interval: 300s
    entity_category: "diagnostic"

  - platform: dallas_temp
    name: "Temperature"
    id: temperature
    update_interval: 10s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x) && x >= 15 && x <= 30;'
            then:
              - lambda: 'id(last_temp_ok_ms) = millis();'
            else:
              - script.execute: safety_shutdown

binary_sensor:
  - platform: template
    name: "Temperature Sensor Fault"
    id: sensor_fault
    device_class: problem
    lambda: |-
      if (id(last_temp_ok_ms) == 0) return true;                   // no valid reading since boot
      if (millis() - id(last_temp_ok_ms) > 60000) return true;     // reading stale > 60 s
      float t = id(temperature).state;
      return isnan(t) || t < 15 || t > 30;                         // missing or out of range

text_sensor:
  - platform: wifi_info
    ssid:
      name: Connected SSID
    ip_address:
      name: IP Address
    dns_address:
      name: DNS Address

status_led:
  pin:
    number: GPIO19
    inverted: true

script:
  - id: safety_shutdown
    mode: single
    then:
      - switch.turn_off: heater
      - if:
          condition:
            lambda: 'return id(controller).mode != climate::CLIMATE_MODE_OFF;'
          then:
            - climate.control:
                id: controller
                mode: "OFF"
            - logger.log:
                format: "Temperature sensor fault (%.1f). Heating forced OFF."
                args: [ 'id(temperature).state' ]
                level: WARN
                tag: ${device_name}

# Watchdog: enforce the interlock even if no new sensor value arrives.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            binary_sensor.is_on: sensor_fault
          then:
            - script.execute: safety_shutdown

climate:
  - platform: bang_bang
    name: "Controller"
    id: controller
    sensor: temperature
    default_target_temperature_low: 24
    default_target_temperature_high: 25
    visual:
      min_temperature: 20
      max_temperature: 26
      temperature_step: 1

    heat_action:
      - if:
          condition:
            binary_sensor.is_off: sensor_fault
          then:
            - switch.turn_on: heater
          else:
            - script.execute: safety_shutdown

    idle_action:
      - switch.turn_off: heater

switch:
  - platform: gpio
    pin: GPIO26
    name: "Heater"
    id: heater
    internal: true            # not controllable from HA / web page
    restore_mode: ALWAYS_OFF  # relay always starts OFF after reboot
    on_turn_on:
      # last-line interlock: never stay on with a faulty sensor
      - if:
          condition:
            binary_sensor.is_on: sensor_fault
          then:
            - switch.turn_off: heater
