# Hardware Sonoff MINI R4 Extreme
#
# DS18B20       <---->    SONOFF
# Red     3v3             
# Black   GND
# Yellow  Data            GPIO01 (TX PIN)
#
# Pin       Function
# GPIO00    BUTTON
# GPIO01    TX
# GPIO03    RX
# GPIO19    Blue LED
# GPIO26    Relay output
# GPIO27    S2 (external switch input)
# GND       S1 (external switch input)
#
# TODO
# - Hide temp as entity
# - [DONE] Hide switch as entity
# - Control from ha based on requested room temperature
# - Default state off if no wifi
# - Document this journey
# - Safety, no ha for x min, disable heating
# - Safety, if it should heat, but nothing is happening - STOP
# - Safety, if it should cool, but nothing is happening - STOP

substitutions:
  device_name: "bedroom-heating"

esphome:
  name: ${device_name}
  friendly_name: "Bedroom Underfloor Heating"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_pass

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: ${device_name}-fix-me
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

#######################
### Main Code Below ###
#######################

dallas:
  - pin: GPIO01
    update_interval: 15s

sensor:
  - platform: wifi_signal
    name: ${device_name} Wifi Signal Strength
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: ${device_name} Uptime
    update_interval: 300s
    entity_category: "diagnostic"

  - platform: dallas
    index: 0
    name: "Temperature"
    id: temperature

text_sensor:
  - platform: wifi_info
    ssid:
      name: Connected SSID
    ip_address:
      name: IP Address
    dns_address:
      name: DNS Address

status_led:
  pin:
    number: GPIO19
    inverted: true

climate:
  - platform: bang_bang
    name: "Controller"
    sensor: temperature
    default_target_temperature_low: 23 °C
    default_target_temperature_high: 25 °C
    visual:
      min_temperature: 18
      max_temperature: 26
      temperature_step: 1

    heat_action:
      - switch.turn_on: heater
    idle_action:
      - switch.turn_off: heater

switch:
  - platform: gpio
    pin: GPIO26
    name: "Heater"
    id: heater
    disabled_by_default: true
